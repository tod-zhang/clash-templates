      - 223.5.5.5
      - 119.29.29.29
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
  ipv6: false
  listen: 0.0.0.0:7874
  default-nameserver:
    - tls://1.12.12.12
  fake-ip-filter:
    - +.lan
    - +.local
    - +.example.com
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.market.xiaomi.com
