🇯🇵 日本节点 = smart, policy-regex-filter=(🇯🇵)|(日本)|(Japan)|(JP), include-other-group=✈️ 我的节点, update-interval=0, no-alert=0, hidden=1, icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-Japan.png
🇨🇳 台湾节点 = smart, policy-regex-filter=(🇨🇳)|(台湾)|(Tai)|(TW), include-other-group=✈️ 我的节点, update-interval=0, no-alert=0, hidden=1, icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-China.png
🇸🇬 新加坡节点 = smart, policy-regex-filter=(🇸🇬)|(新加坡)|(Singapore)|(SG), include-other-group=✈️ 我的节点, update-interval=0, no-alert=0, hidden=1, icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-Singapore.png
✈️ 我的节点 = select, policy-path=你的订阅地址, update-interval=0, no-alert=0, icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Proxy.png

